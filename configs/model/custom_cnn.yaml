name: custom_cnn
type: custom
hard_param_limit: 5000000
active_variant: medium
variants:
  small:
    description: Proposal baseline 4-block layout (32, 64, 128, 128)
    target_params: roughly 0.24M (< 0.5M)
    stage_channels:
    - 32
    - 64
    - 128
    - 128
    convs_per_block: 1
    kernel_size: 3
    stride: 1
    padding: 1
    pool_size: 2
    dropout_rates:
    - 0.0
    - 0.0
    - 0.0
    - 0.0
    gap_dropout: 0.4
  medium:
    description: Wider 4-block layout (64, 128, 256, 288)
    target_params: roughly 1.04M (~1.0M target)
    stage_channels:
    - 64
    - 128
    - 256
    - 288
    convs_per_block: 1
    kernel_size: 3
    stride: 1
    padding: 1
    pool_size: 2
    dropout_rates:
    - 0.0
    - 0.0
    - 0.0
    - 0.0
    gap_dropout: 0.4
  large:
    description: High-capacity 4-block layout (64, 160, 384, 544)
    target_params: roughly 2.53M (~2.5M target)
    stage_channels:
    - 64
    - 160
    - 384
    - 544
    convs_per_block: 1
    kernel_size: 3
    stride: 1
    padding: 1
    pool_size: 2
    dropout_rates:
    - 0.0
    - 0.0
    - 0.0
    - 0.0
    gap_dropout: 0.4
head:
  type: expandable_linear
  initial_num_classes: 2
  total_classes: 4
  dropout: 0.4
