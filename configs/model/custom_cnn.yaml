# Custom Lightweight CNN Architecture Configuration (<5M parameters)
name: "custom_cnn"
type: "custom"
max_parameter_budget: 5000000

backbone:
  in_channels: 3
  # 4 convolutional blocks: 32 -> 64 -> 128 -> 128
  stage_channels: [32, 64, 128, 128]
  kernel_size: 3
  stride: 1
  padding: 1
  activation: "relu"
  use_batchnorm: true
  pool_type: "max"
  pool_size: 2
  dropout_rates: [0.1, 0.1, 0.2, 0.2]

head:
  type: "expandable_linear"
  pooling: "adaptive_avg_pool2d"
  fc_layers: [128] # Dense feature aggregation before logits
  dropout: 0.3
  initial_num_classes: 2 # Dynamically updated by incremental runner
