# Standard Training Hyperparameters
batch_size: 32
num_epochs: 30
gradient_clip_val: 1.0

optimizer:
  name: "adamw"
  lr: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  name: "cosine"
  t_max: 30
  min_lr: 0.000001
  warmup_epochs: 2

loss:
  criterion: "cross_entropy"
  label_smoothing: 0.05

early_stopping:
  patience: 7
  min_delta: 0.0005
  monitor: "val_loss"
  mode: "min"

checkpointing:
  save_best_only: true
  monitor: "val_macro_f1"
  mode: "max"
