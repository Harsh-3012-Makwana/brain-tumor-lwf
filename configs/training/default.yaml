# Standard Joint Training Hyperparameters
batch_size: 64
num_epochs: 30
gradient_clip_val: 1.0
num_workers: 0
use_amp: true

# BatchNorm continual update policy: "standard" | "frozen_after_task1"
bn_policy: "standard"

optimizer:
  name: "adamw"
  lr: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  name: "cosine"
  warmup_epochs: 2
  min_lr: 0.000001

loss:
  criterion: "cross_entropy"

early_stopping:
  enabled: false
  patience: 8
  min_delta: 0.0005
  monitor: "val_macro_f1"
  mode: "max"

checkpointing:
  save_best_only: false
  monitor: "val_macro_f1"
  mode: "max"
