# Class-Incremental Learning Task Orders
# 4 classes total: glioma, meningioma, pituitary, notumor

orders:
  order_a:
    description: "Pathology-first: begins with two intra/extra-axial neoplasms, introduces sellar mass, ends with healthy scans."
    tasks:
      task_1:
        classes: ["glioma", "meningioma"]
        num_classes_cumulative: 2
      task_2:
        classes: ["pituitary"]
        num_classes_cumulative: 3
      task_3:
        classes: ["notumor"]
        num_classes_cumulative: 4

  order_b:
    description: "Control-first: begins with healthy control and sellar lesion, then incrementally introduces glioma and meningioma."
    tasks:
      task_1:
        classes: ["notumor", "pituitary"]
        num_classes_cumulative: 2
      task_2:
        classes: ["glioma"]
        num_classes_cumulative: 3
      task_3:
        classes: ["meningioma"]
        num_classes_cumulative: 4
