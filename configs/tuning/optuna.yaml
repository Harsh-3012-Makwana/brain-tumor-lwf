# Hyperparameter Tuning with Optuna Configuration
study_name: "brain_tumor_lwf_hpo"
direction: "maximize"
target_metric: "val_macro_f1"
n_trials: 30
timeout_seconds: 7200
pruner:
  name: "median"
  n_startup_trials: 5
  n_warmup_steps: 5

search_space:
  lr:
    type: "float"
    low: 0.00005
    high: 0.001
    log: true
  weight_decay:
    type: "float"
    low: 0.00001
    high: 0.01
    log: true
  batch_size:
    type: "categorical"
    choices: [16, 32, 64]
  lwf_temperature:
    type: "float"
    low: 1.0
    high: 6.0
    step: 0.5
  lwf_lambda:
    type: "float"
    low: 0.5
    high: 4.0
    step: 0.5
