variant: medium
seed: 123
training:
  batch_size: 64
  num_epochs: 30
  gradient_clip_val: 1.0
  num_workers: 0
  use_amp: true
  bn_policy: standard
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.999
  scheduler:
    name: cosine
    warmup_epochs: 2
    min_lr: 1.0e-06
  loss:
    criterion: cross_entropy
  early_stopping:
    enabled: false
  checkpointing:
    save_best_only: false
    monitor: val_macro_f1
    mode: max
